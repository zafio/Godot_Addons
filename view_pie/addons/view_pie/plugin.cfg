[plugin]

name="View Pie"
description="Blender-style pie menu for the 3D viewport. Hold Z, flick toward an item, release. Overlays, Wireframe, Shadeless + Wireframe, Shadeless, Solid, Preview Sunlight, Preview Environment, Frame Selected. Alt+Z reverts everything to how the editor was before. Shortcuts are in Editor Settings > Shortcuts > View Pie; colours in Editor Settings > View Pie. Requires Godot 4.6+."
author="Zafio"
version="1.1.0"
script="plugin.gd"
