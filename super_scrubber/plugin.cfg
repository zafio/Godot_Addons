[plugin]

name="SuperScrubber"
description="Blender-style scrubbing in the Animation dock: hold G to drag the playhead, tap G or F to insert keyframes, Space/F + mouse wheel to change key values, Q/E to jump to the previous/next keyframe of the selection, and an Auto Key toggle that keys viewport and Inspector changes as you make them."
author="Zafio"
version="1.5.2"
script="plugin.gd"
