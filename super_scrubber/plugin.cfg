[plugin]

name="SuperScrubber"
description="Blender-style scrubbing in the Animation dock: hold G to drag the playhead, tap G or F to insert keyframes, Space/F + mouse wheel to change key values, Q/E to jump to the previous/next keyframe of the selection, an Auto Key toggle that keys viewport and Inspector changes as you make them, a Speed Scale box and an FPS mode for stepped playback."
author="Zafio"
version="1.7.1"
script="plugin.gd"
